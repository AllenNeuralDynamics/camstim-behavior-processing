groups:
- neurodata_type_def: ChangeDetectionTaskParameters
  neurodata_type_inc: LabMetaData
  doc: Task parameters for the visual change-detection task (images / gratings, 
    response-window detection paradigm).
  attributes:
  - name: change_flashes_min
    dtype: int
    doc: Minimum number of stimulus flashes before a change can occur.
    required: false
  - name: change_flashes_max
    dtype: int
    doc: Maximum number of stimulus flashes before a change can occur (if no 
      change has occurred, the trial closes).
    required: false
  - name: change_time_distribution
    dtype: text
    doc: 'Distribution used to draw change times. Typical values: "geometric", "exponential".'
    required: false
  - name: change_time_scale
    dtype: float
    doc: Scale parameter of the change-time distribution (seconds).
    required: false
  - name: pre_change_time_sec
    dtype: float
    doc: Required no-change time at the start of each trial (seconds).
    required: false
  - name: min_no_lick_time_sec
    dtype: float
    doc: Required no-lick period before a trial advances (seconds).
    required: false
  - name: timeout_duration_sec
    dtype: float
    doc: Timeout penalty after a false alarm or abort (seconds).
    required: false
  - name: end_after_response_sec
    dtype: float
    doc: Trial duration after a response is detected (seconds).
    required: false
  - name: failure_repeats
    dtype: int
    doc: Number of times a failed trial is repeated.
    required: false
  - name: catch_frequency
    dtype: float
    doc: Fraction of trials that are catch trials (no change). Only set when 
      catch_mode is "explicit"; omitted when catch_mode is "implicit".
    required: false
  - name: catch_mode
    dtype: text
    doc: 'How catch trials are produced. "explicit": each trial has a fixed catch_frequency
      probability of being a catch trial. "implicit": sham changes are drawn from
      the change-time distribution and occur on trials that end before the drawn change
      time.'
    required: false
  - name: stimulus_class
    dtype: text
    doc: 'Class of stimulus presented. Typical values: "images", "gratings".'
    required: false
  - name: image_set_name
    dtype: text
    doc: Name of the image set used (file name without path).
    required: false
  - name: stimulus_duration_sec
    dtype: float
    doc: Duration of each stimulus flash (seconds).
    required: false
  - name: blank_duration_sec
    dtype: float
    doc: Duration of the gray-screen gap between flashes (seconds).
    required: false
  - name: flash_omit_probability
    dtype: float
    doc: Fraction of stimulus flashes that are intentionally omitted.
    required: false
  - name: reward_volume_ml
    dtype: float
    doc: Volume of each earned water reward (mL).
    required: false
  - name: auto_reward_volume_ml
    dtype: float
    doc: Volume of each auto-delivered water reward (mL).
    required: false
  - name: auto_reward_delay_sec
    dtype: float
    doc: Delay between change and auto-reward delivery (seconds).
    required: false
  - name: volume_limit_ml
    dtype: float
    doc: Maximum total reward volume per session (mL).
    required: false
  - name: free_reward_trials
    dtype: int
    doc: Number of miss trials after which a free reward is given as a prompt for mouse to re-engage with the task.
    required: false
  - name: warm_up_trials
    dtype: int
    doc: Number of warm-up trials with reduced difficulty at session start.
    required: false
  - name: session_type
    dtype: text
    doc: Session-type identifier (e.g. "OPHYS_3_images_A").
    required: false
  - name: task_id
    dtype: text
    doc: Task-protocol identifier (e.g. "DoC" for detection-of-change).
    required: false
  - name: task_name
    dtype: text
    doc: Human-readable task name (e.g. "change detection").
    required: false
  - name: max_task_duration_min
    dtype: float
    doc: Maximum session duration in minutes before forced stop.
    required: false
  - name: epilogue_name
    dtype: text
    doc: Name of the post-task stimulus epilogue (e.g. "fingerprint").
    required: false
  - name: epilogue_movie_path
    dtype: text
    doc: Path to the movie file used in the epilogue.
    required: false
  - name: epilogue_runs
    dtype: int
    doc: Number of repetitions of the epilogue movie.
    required: false
  - name: epilogue_frame_length_sec
    dtype: float
    doc: Frame length of the epilogue movie (seconds per frame).
    required: false
  - name: task_hed_tags
    dtype: text
    doc: HED tag string describing the task at the protocol level (e.g. "Task, 
      Visual-detection-task").
    required: false
  datasets:
  - name: response_window_sec
    dtype: float
    shape:
    - 2
    doc: '[start, stop] of the response window relative to change (seconds).'
    quantity: '?'
